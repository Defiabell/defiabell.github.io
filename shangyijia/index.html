<style>

<script>
'use strict';
/* ---------- constants ---------- */
const W=960,H=540,FLOOR=404,DT=1/60;
const RUN=245,JUMP_V=560,GRAV=1500,HW=13,H_STAND=60,H_DUCK=30;
const B_R=9,H_CHEST=42,H_LOW=16,START_X=110,REWIND=42,MAX_FOES=8;
const TEST=new URLSearchParams(location.search).has('test');
const TOUCH='ontouchstart'in window||navigator.maxTouchPoints>0;
/* The page may sit inside a host frame: take the address and the ?c= challenge from the top page when allowed. */
function pageUrl(){let u='';try{u=top.location.href}catch(e){}if(!u&&top!==window&&document.referrer)u=document.referrer;return(u||location.href).split(/[?#]/)[0]}
function param(k){for(const w of[window,top]){try{const v=new URLSearchParams(w.location.search).get(k);if(v)return v}catch(e){}}return null}
const CH=Math.max(0,Math.min(999,parseInt(param('c'))||0));   // a friend's result: this visitor arrived from a shared card
const QR=new Promise(res=>{const el=document.createElement('script');el.src='./vendor/qrcode.js';
  el.onload=()=>res(window.qrcode||null);el.onerror=()=>res(null);document.head.appendChild(el);setTimeout(()=>res(null),8000)});

const ROOMS={
  yard:{name:'院子',hint:'什么都没有，只有你和上一家的你。',sky:['#0b1233','#2a3a78'],ground:'#eaf2ff',edge:'#c2d2f2'},
  table:{name:'餐厅',hint:'长桌挡住低处的雪球，高处的照样飞。',sky:['#2b1520','#5c2d30'],ground:'#7d4c38',edge:'#5f3727',indoor:1},
  chimney:{name:'屋顶',hint:'烟囱挡雪球，只有跳起来扔才越得过去。',sky:['#060a22','#1c2c63'],ground:'#8f3d3d',edge:'#6e2b2d'},
  attic:{name:'阁楼',hint:'两边墙上钉着软垫，雪球碰到会弹回来。',sky:['#1e1727','#3d2e42'],ground:'#8b6b4b',edge:'#6b4f35',indoor:1},
  lights:{name:'客厅',hint:'雪球穿过中间那串彩灯，高的变低，低的变高。',sky:['#0f231f','#25493e'],ground:'#aa7550',edge:'#82563a',indoor:1},
  ice:{name:'门廊',hint:'地上结了冰，你停不稳。影子不受影响。',sky:['#0a1a35','#2c527f'],ground:'#c4e8ff',edge:'#8fc6ee'}
};
const MODS={
  wind:{name:'刮风',hint:'顺风的雪球更快，逆风的更慢。'},
  dark:{name:'停电',hint:'只有扔雪球的一瞬间才亮。'},
  float:{name:'轻飘飘',hint:'你跳得又高又慢。'}
};
const PICKS={big:{name:'大雪球',hint:'又大又硬，高低都砸得到，还能撞碎别的雪球'},bounce:{name:'弹力球',hint:'碰墙会弹回来一次'},twin:{name:'双发',hint:'一高一低同时扔出去'}};
const STORY=['这家的孩子要一辆红色三轮车。','这家只留了一杯牛奶，没有饼干。','这家的狗没睡，尾巴一直在摇。','这家的信上写着：想要下雪。',
  '这家的袜子挂得特别高。','这家的灯一直没关。','这家的孩子要一只不会掉毛的猫。','这家门口堆了三个雪人。','这家的烟囱是去年新砌的。',
  '这家的信写了两页，全是恐龙。','这家的老人也挂了袜子。','这家把钥匙放在了垫子下面。','这家的圣诞树是用书摞的。','这家的孩子说今年不要礼物，要爸爸回家。'];
const FIRST={1:'按 J 扔雪球，砸中门口的雪人。',2:'门口站着上一家的你。你刚才怎么做的，它就原样做一遍。',
  3:'前两家的你都来了。全部砸中才能进屋。',4:'每过一家，门口就多一个你。你扔得越多，下一家飞过来的就越多。'};

/* ---------- utils ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const $=id=>document.getElementById(id);

/* ---------- state ---------- */
const G={mode:'title',kind:'daily',seed:0,label:'',n:0,fails:0,recs:[],plan:[],tm:0,best:{},resume:'',rt:'再来'};
let L=null;
const keys={l:0,r:0,j:0,d:0,t:0},prev={j:0,t:0};
let tap=false;
try{G.best=JSON.parse(localStorage.getItem('syj-best2')||'{}')}catch(e){}

function makePlan(seed){
  const r=mulberry(seed),plan=[];let prevRoom='';
  for(let n=1;n<=1000;n++){
    const calm=n>1&&n%5===0;let room='yard';
    if(n>=3&&!calm){const pool=Object.keys(ROOMS).filter(k=>k!=='yard'&&k!==prevRoom);room=pool[Math.floor(r()*pool.length)]}
    const mods=[],mk=Object.keys(MODS);
    if(n>=6&&!calm){if(r()<0.6)mods.push(mk[Math.floor(r()*mk.length)]);
      if(n>=11&&r()<0.45){const m2=mk[Math.floor(r()*mk.length)];if(!mods.includes(m2))mods.push(m2)}}
    let pick=null;
    if(n>=4&&!calm&&room!=='chimney'&&r()<0.5)pick={type:Object.keys(PICKS)[Math.floor(r()*3)],x:room==='table'?300:300+Math.floor(r()*140)};
    plan.push({n,room,mods,pick,calm,wind:(r()<0.5?-1:1)*100,story:Math.floor(r()*STORY.length)});prevRoom=room;
  }
  return plan;
}
function dummyRec(){return{dummy:true,len:240,xs:[W-820],ys:[0],fl:[2],throws:[]}}
function pose(rec,f){const i=Math.min(f,rec.xs.length-1),fl=rec.fl[i];
  return{x:W-rec.xs[i],y:rec.ys[i],duck:fl&1,face:(fl&2)?-1:1,thr:fl&4,air:fl&8}}

function today(){const d=new Date();return{seed:d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(),label:'今日局 '+(d.getMonth()+1)+'-'+d.getDate()}}
function startRun(kind){
  G.kind=kind;
  if(kind==='daily'){const t=today();G.seed=t.seed;G.label=t.label}else{G.seed=(Math.random()*1e9)|0;G.label='随机局'}
  G.plan=makePlan(G.seed);G.recs=[];G.fails=0;panel(false);beginLevel(1);
}
/* No fail state: a run never ends, so it is saved at every door and can be picked up later. */
function loadSave(){try{const s=JSON.parse(localStorage.getItem('syj-save')||'null');return s&&s.n>1&&s.recs&&s.recs[s.n-1]?s:null}catch(e){return null}}
function persist(){
  if(G.n<2)return;const recs={},q=v=>Math.round(v*100)/100;
  for(let i=Math.max(1,G.n-MAX_FOES);i<G.n;i++){const r=G.recs[i];if(r)recs[i]={len:r.len,xs:r.xs.map(q),ys:r.ys.map(q),fl:r.fl,throws:r.throws}}
  try{localStorage.setItem('syj-save',JSON.stringify({kind:G.kind,seed:G.seed,label:G.label,n:G.n,fails:G.fails,recs}))}catch(e){}
}
function resumeRun(){
  const s=loadSave();if(!s)return startRun('daily');
  G.kind=s.kind;G.seed=s.seed;G.label=s.label;G.fails=s.fails||0;G.plan=makePlan(s.seed);G.recs=[];
  for(const k in s.recs)G.recs[+k]=s.recs[k];
  panel(false);beginLevel(s.n);
}
function noteBest(n){
  const b=G.best;let ch=false;
  if(G.kind==='daily'){if(!b.d||b.d.seed<G.seed||(b.d.seed===G.seed&&b.d.n<n)){b.d={seed:G.seed,n};ch=true}}
  else if(!(b.r>=n)){b.r=n;ch=true}
  if(ch)try{localStorage.setItem('syj-best2',JSON.stringify(b))}catch(e){}
}
/* Every earlier self is a real opponent: house n is guarded by the selves of houses n-1, n-2, ... (newest first, at most MAX_FOES).
   Each replays its own recording mirrored, on its own loop. All of them must be hit. */
function beginLevel(n){
  const sp=G.plan[Math.min(n,G.plan.length)-1],foes=[];
  if(n===1)foes.push({rec:dummyRec(),from:0});
  else for(let i=1;i<=(sp.calm?1:MAX_FOES);i++){const r=G.recs[n-i];if(r)foes.push({rec:r,from:n-i})}
  // older selves line up a step further back, so a crowd at the door reads as a crowd
  foes.forEach((e,i)=>{e.act=e.rec.dummy?1e9:Math.max(e.rec.len,90);e.per=e.act+REWIND;e.dx=i*10});   // the snowman never rewinds
  L={n,sp,room:sp.room,mods:sp.mods,foes,
    blocks:sp.room==='table'?[{x:410,w:140,h:30}]:sp.room==='chimney'?[{x:462,w:36,h:80}]:[],
    speed:Math.min(400+13*(n-1),620),wind:sp.mods.includes('wind')?sp.wind:0,ammo0:foes.length+2,maxT:14+3*foes.length,tries:0};
  G.n=n;noteBest(n);persist();
  startAttempt();G.mode='intro';G.tm=0;
}
function startAttempt(){
  Object.assign(L,{p:{x:START_X,y:0,vx:0,vy:0,ground:true,duck:false,face:1,cool:0,thr:0,special:null},
    balls:[],parts:[],ammo:L.ammo0,t:0,flash:0,shake:0,cleared:false,pickTaken:false,msg:'',emptyT:0,
    rec:{xs:[],ys:[],fl:[],throws:[],len:0}});
  for(const e of L.foes){e.lf=0;e.dead=false;e.cycle=0}
  L.tries++;
}
const left=()=>L.foes.filter(e=>!e.dead).length;
function fpose(e,f){const q=pose(e.rec,Math.min(f,e.act-1));q.x=Math.min(W-30,q.x+e.dx);return q}

/* ---------- audio ---------- */
let AC=null;
function beep(f,d,type,v,slide){if(TEST)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}

/* ---------- simulation ---------- */
function puff(x,h,n,col,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=(sp||120)*(.3+Math.random());
  L.parts.push({x,y:FLOOR-h,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:.35+Math.random()*.35,col:col||'#fff',r:2+Math.random()*3})}}
function spawnBall(own,x,h,dir,type,from){
  const big=type==='big';
  L.balls.push({own,x,h,dir,type,from,r:big?19:B_R,life:8,bounces:0,hot:false,trail:[]});
  L.flash=1;beep(own==='me'?520:300,.09,'triangle',.05,own==='me'?260:-120);
}
function addThrow(x,h,dir,type){L.rec.throws.push({f:L.rec.len,x,h,dir,type});spawnBall('me',x,h,dir,type,L.n)}
function playerThrow(){
  const p=L.p,type=p.special||'n';p.special=null;L.ammo--;p.cool=.28;p.thr=.18;
  const x=p.x+p.face*18;
  if(type==='twin'){addThrow(x,p.y+H_CHEST,p.face,'n');addThrow(x,p.y+H_LOW,p.face,'n')}
  else if(type==='big')addThrow(x,p.y+30,p.face,'big');
  else addThrow(x,p.y+(p.duck?H_LOW:H_CHEST),p.face,type);
}
function stepPlayer(){
  const p=L.p,fl=L.mods.includes('float'),g=fl?GRAV*.5:GRAV,jv=fl?JUMP_V*.78:JUMP_V;
  p.duck=!!keys.d&&p.ground;
  const want=(keys.r?1:0)-(keys.l?1:0);if(want)p.face=want;
  const maxv=p.duck?RUN*.35:RUN;
  if(L.room==='ice')p.vx+=(want*maxv-p.vx)*Math.min(1,(p.ground?2.4:1.2)*DT);else p.vx=want*maxv;
  if(keys.j&&!prev.j&&p.ground){p.vy=jv;p.ground=false;p.duck=false;beep(380,.1,'sine',.04,200)}
  let nx=clamp(p.x+p.vx*DT,40,W-40);
  for(const b of L.blocks)if(p.y<b.h-.01&&nx+HW>b.x&&nx-HW<b.x+b.w){nx=p.x<b.x+b.w/2?b.x-HW:b.x+b.w+HW;p.vx=0}
  p.x=nx;
  p.vy-=g*DT;let ny=p.y+p.vy*DT,floor=0;
  for(const b of L.blocks)if(p.x+HW>b.x&&p.x-HW<b.x+b.w)floor=Math.max(floor,b.h);
  if(ny<=floor){ny=floor;p.vy=0;p.ground=true}else p.ground=false;
  p.y=ny;
  if(p.cool>0)p.cool-=DT;if(p.thr>0)p.thr-=DT;
  const pk=L.sp.pick;
  if(pk&&!L.pickTaken&&Math.abs(p.x-pk.x)<24&&p.y<24){L.pickTaken=true;p.special=pk.type;L.ammo++;beep(700,.16,'sine',.06,400);puff(pk.x,14,10,'#ffe58a')}
  if(keys.t&&!prev.t&&p.cool<=0&&L.ammo>0)playerThrow();
  const r=L.rec;r.xs.push(p.x);r.ys.push(p.y);r.fl.push((p.duck?1:0)|(p.face>0?2:0)|(p.thr>0?4:0)|(p.ground?0:8));r.len++;
}
function stepFoes(){
  for(const e of L.foes){
    if(e.dead)continue;const r=e.rec;
    if(e.lf<r.len)for(const t of r.throws)if(t.f===e.lf)spawnBall('echo',Math.min(W-30,W-t.x+e.dx),t.h,-t.dir,t.type,e.from);
    e.lf++;if(e.lf>=e.per){e.lf=0;e.cycle++}
  }
}
function hitRect(b,x,y,ht,pad){const cx=clamp(b.x,x-HW,x+HW),cy=clamp(b.h,y,y+ht),dx=b.x-cx,dy=b.h-cy,r=b.r+pad;return dx*dx+dy*dy<r*r}
function stepBalls(){
  const p=L.p,bs=L.balls;
  for(const b of bs){
    const px=b.x;b.x+=(b.dir*L.speed+L.wind)*DT;b.life-=DT;
    b.trail.push(px);if(b.trail.length>6)b.trail.shift();
    if(b.life<=0){b.dead=1;puff(b.x,b.h,4,'#dfe9ff',60);continue}
    if(L.room==='lights'&&b.type!=='big'&&(px-480)*(b.x-480)<=0&&px!==b.x){b.h=b.h>=30?H_LOW:H_CHEST;puff(480,b.h,6,'#ffd76a',90);b.trail.length=0}
    if(b.x<24||b.x>W-24){

    }

  }

    const a=bs[i],b=bs[j];if(a.dead||b.dead||(a.own==='me')===(b.own==='me'))continue;

      const ab=a.type==='big',bb=b.type==='big';if(!ab||bb)a.dead=1;if(!bb||ab)b.dead=1;

          if(!left())return win();break}
      }

function win(){

function fail(kind,b){

function stepFx(){
  if(!L)return;

  L.parts=L.parts.filter(q=>q.life>0);

function step(){
  G.tm+=DT;const any=tap;tap=false;

  else if(G.mode==='ready'){if(G.tm>.6){G.mode='play';G.tm=0}}
  else if(G.mode==='play'){
    stepPlayer();stepFoes();stepBalls();
    if(G.mode==='play'){
      L.t+=DT;
      const mine=L.balls.some(b=>b.own==='me'),canPick=L.sp.pick&&!L.pickTaken;
      if(L.ammo<=0&&!mine&&!canPick){L.emptyT+=DT;if(L.emptyT>.25)fail('ammo')}else L.emptyT=0;
      if(G.mode==='play'&&L.t>L.maxT)fail('dawn');
    }
  }else if(G.mode==='clear'){
    const p=L.p;if(p.y>0){p.vy-=GRAV*DT;p.y=Math.max(0,p.y+p.vy*DT)}
    if(G.tm>.25&&p.x<W-52){p.x=Math.min(W-52,p.x+430*DT);p.face=1;p.duck=false}

  }
  prev.j=keys.j;prev.t=keys.t;stepFx();
}
